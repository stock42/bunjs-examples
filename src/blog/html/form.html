<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Crear Post</title>
		<script src="https://cdn.tailwindcss.com"></script>
	</head>
	<body class="bg-gray-100 min-h-screen flex items-center justify-center">
		<div class="container mx-auto p-4 max-w-2xl">
			<h1 class="text-3xl font-bold text-center mb-8">Crear Nuevo Post</h1>
			<form
				id="create-post-form"
				class="bg-white rounded-lg shadow-md p-6"
				enctype="multipart/form-data"
			>
				<div class="mb-4">
					<label for="title" class="block text-gray-700 font-semibold mb-2"
						>Título</label
					>
					<input
						type="text"
						id="title"
						name="title"
						required
						class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
						placeholder="Ingresa el título del post"
					/>
				</div>
				<div class="mb-4">
					<label
						for="description"
						class="block text-gray-700 font-semibold mb-2"
						>Descripción</label
					>
					<textarea
						id="description"
						name="description"
						required
						class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
						rows="4"
						placeholder="Ingresa una breve descripción"
					></textarea>
				</div>
				<div class="mb-4">
					<label for="image" class="block text-gray-700 font-semibold mb-2"
						>Imagen de Portada</label
					>
					<input
						type="file"
						id="image"
						name="image"
						accept="image/*"
						required
						class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
					/>
				</div>
				<div class="mb-4">
					<label for="content" class="block text-gray-700 font-semibold mb-2"
						>Contenido</label
					>
					<textarea
						id="content"
						name="content"
						required
						class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
						rows="8"
						placeholder="Escribe el contenido del post"
					></textarea>
				</div>
				<button
					type="submit"
					class="w-full bg-blue-500 text-white font-semibold py-2 rounded-lg hover:bg-blue-600 transition"
				>
					Crear Post
				</button>
				<p id="message" class="mt-4 text-center text-red-500 hidden"></p>
			</form>
			<div class="flex justify-end mt-6">
				<a
					href="/"
					class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition"
					>Volver</a
				>
			</div>
		</div>

		<script>
			document
				.getElementById("create-post-form")
				.addEventListener("submit", async (e) => {
					e.preventDefault();

					const formData = new FormData();
					formData.append("title", document.getElementById("title").value);
					formData.append(
						"description",
						document.getElementById("description").value
					);
					formData.append("image", document.getElementById("image").files[0]);
					formData.append("content", document.getElementById("content").value);

					try {
						const response = await fetch("/api/create-post", {
							method: "POST",
							body: formData,
						});

						const result = await response.json();
						const messageElement = document.getElementById("message");

						if (response.ok) {
							messageElement.classList.remove("text-red-500", "hidden");
							messageElement.classList.add("text-green-500");
							messageElement.textContent = "Post creado exitosamente";
							document.getElementById("create-post-form").reset();
						} else {
							messageElement.classList.remove("hidden");
							messageElement.textContent =
								result.message || "Error al crear el post";
						}
					} catch (error) {
						console.error("Error al enviar el formulario:", error);
						const messageElement = document.getElementById("message");
						messageElement.classList.remove("hidden");
						messageElement.textContent = "Error al conectar con el servidor";
					}
				});
		</script>
	</body>
</html>
