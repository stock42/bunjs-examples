<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lista de Posts</title>
		<script src="https://cdn.tailwindcss.com"></script>
	</head>
	<body class="bg-gray-100 min-h-screen">
		<div class="container mx-auto p-4">
			<h1 class="text-3xl font-bold text-center mb-8">Posts</h1>
			<a href="/create" class="block text-blue-500 mb-4">Crear nuevo post</a>
			<div
				id="posts-container"
				class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
			>
				<!-- Los posts se insertarán aquí -->
			</div>
		</div>

		<script>
			async function fetchPosts() {
				try {
					const response = await fetch("/api/all-post", {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
						},
					});
					const posts = await response.json();
					displayPosts(posts);
				} catch (error) {
					console.error("Error al obtener los posts:", error);
					document.getElementById("posts-container").innerHTML =
						'<p class="text-red-500 text-center">Error al cargar los posts</p>';
				}
			}

			function displayPosts(posts) {
				const container = document.getElementById("posts-container");
				container.innerHTML = ""; // Limpiar contenido previo

				posts.forEach((post) => {
					const postElement = document.createElement("div");
					postElement.className =
						"bg-white rounded-lg shadow-md p-4 hover:shadow-lg transition";
					postElement.innerHTML = `
                    <a href="/post/${post.slug}">
                        <img src="${post.image}" alt="${post.title}" class="w-full h-48 object-cover rounded-t-lg">
                        <div class="p-4">
                            <h2 class="text-xl font-semibold mb-2">${post.title}</h2>
                            <p class="text-gray-600">${post.description}</p>
                        </div>
                    </a>
                `;
					container.appendChild(postElement);
				});
			}

			// Cargar los posts al iniciar
			fetchPosts();
		</script>
	</body>
</html>
